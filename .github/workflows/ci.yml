name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app/*.py

      - name: Build Docker image
        run: docker build -t secureflow-api:ci .
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r scripts/requirements.txt --strict --desc

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t secureflow-api:ci .

      - name: Save image to a tar file
        run: docker save -o image.tar secureflow-api:ci

      - name: Scan image with Trivy
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/aquasecurity/trivy:0.76.1 \
            image --input /work/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create a throwaway .env for the test stack
        run: |
          {
            echo "POSTGRES_USER=secureflow"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=secureflow"
          } > .env

      - name: Start the app
        run: docker compose up -d --build

      - name: Wait until the API is ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          echo "API did not become ready" >&2
          docker compose logs api
          exit 1

      - name: Smoke test with netcheck.sh
        run: ./scripts/netcheck.sh http://127.0.0.1:8000/health

      - name: Run ZAP API scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network secureflow_default \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-api-scan.py -t http://api:8000/openapi.json -f openapi -r zap-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap-out/zap-report.html

      - name: Stop the app
        if: always()
        run: docker compose down -v
